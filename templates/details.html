{% extends 'master.html' %}

{% block content %}
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-sm-6">
            <h2>{{ user.names |upper }}</h2>
            <p>{{ user.email |lower }}</p>
            <p>{{ user.phone }}</p>
            <p>Gender is:{{ user.gender |capfirst }}</p>
            <p>Weight is:{{ user.weight }}kg</p>
            <p>Height is:{{ user.height }}cm</p>
            
        </div>
      </div>
    </div>

{% endblock %}
